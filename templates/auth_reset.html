{% extends "site_base.html" %}
{% block title %}Set New Password · SepsisSense{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 24px;">
      <h2>Set New Password</h2>
      <p>Enter your new secure password below.</p>
    </div>

    <form method="POST" action="{{ url_for('auth_reset_password') }}">
      <div class="form-group">
        <label for="newPass">New Password</label>
        <input type="password" id="newPass" name="new_password" class="form-control" minlength="8" required autofocus>
      </div>

      <div class="form-group">
        <label for="confirmPass">Confirm New Password</label>
        <input type="password" id="confirmPass" name="confirm_password" class="form-control" minlength="8" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
        Update Password
      </button>
    </form>
  </div>
</div>
{% endblock %}
